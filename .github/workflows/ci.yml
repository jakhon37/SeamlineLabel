name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # Ubuntu's AppArmor keeps apps without a profile from the user namespaces Chromium's sandbox uses
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests
        # Chromium's GPU process wants a display even for a headless window, and Linux runners have none
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npx playwright test --reporter=line
        env:
          E2E_SHOTS: ${{ runner.temp }}/shots
          # Prints the app's own output, which is all there is to go on when a launch fails
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results
            ${{ runner.temp }}/shots
          retention-days: 7

  labelme-reads:
    # Files this app writes must load in labelme itself, old and new
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: npx electron-vite build
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Write label files with the app
        run: xvfb-run -a npx playwright test e2e/labelme.spec.ts e2e/ai.spec.ts --reporter=line
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
      - name: Load them with labelme 7 and labelme 5
        shell: bash
        run: |
          files=$(ls ${{ runner.temp }}/e2e/{shapes/s,dialog/q,prelabel/p1,edit/a,output-labels/o}.json)
          uv run --no-project --python 3.12 --with labelme python tests/parity/labelme_reads.py $files
          uv run --no-project --python 3.12 --with 'labelme==5.8.1' python tests/parity/labelme_reads.py $files

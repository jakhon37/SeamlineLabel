name: release

# Builds the installers on each system. A version tag (v3.0.0) also makes a draft release
# with all of them; any run keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --arm64
          # An Intel Mac, so sharp and onnxruntime install their Intel builds
          - os: macos-26-intel
            args: --mac --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # --version loads sharp and onnxruntime before it answers, so a package missing either fails here
      - name: The packaged app starts
        shell: bash
        timeout-minutes: 5
        run: |
          case "$RUNNER_OS" in
            Linux)
              # As a user installs it: the .deb adds the AppArmor profile Ubuntu 24.04 wants before Chromium's sandbox may run
              sudo apt-get update -q > /dev/null
              sudo apt-get install -y -q ./release/*.deb > /dev/null
              seamtag --version
              # An AppImage can't add one, so on Ubuntu it needs --no-sandbox; elsewhere it runs as it is
              ./release/*.AppImage --appimage-extract-and-run --no-sandbox --version 2>&1 | grep -o "Seamtag [0-9][0-9.]*"
              sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
              ./release/*.AppImage --appimage-extract-and-run --version 2>&1 | grep -o "Seamtag [0-9][0-9.]*"
              ;;
            Windows) release/win-unpacked/seamtag.exe --version ;;
            macOS) "$(find release -maxdepth 2 -name '*.app' | head -1)"/Contents/MacOS/* --version ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: installers/*
          generate_release_notes: true

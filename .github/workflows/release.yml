name: release

# Builds the installers on each system. A version tag (v3.0.0) also makes a draft release
# with all of them; any run keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --arm64
          # An Intel Mac, so sharp and onnxruntime install their Intel builds
          - os: macos-26-intel
            args: --mac --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # --version loads sharp and onnxruntime before it answers, so a package missing either fails here
      - name: The packaged app starts
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) app=release/linux-unpacked/seamline-label ;;
            Windows) app="release/win-unpacked/Seamline Label.exe" ;;
            macOS) app="$(ls -d release/mac*/'Seamline Label.app')/Contents/MacOS/Seamline Label" ;;
          esac
          "$app" --version
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: installers/*
          generate_release_notes: true

# Installers for Windows, macOS and Linux. Each is built on its own system in CI
# (.github/workflows/release.yml); `npm run dist` builds the one for this computer.
appId: io.github.jakhon37.seamtag
productName: Seamtag
executableName: seamtag
copyright: Copyright © 2026 Jakhongir Nodirov
artifactName: Seamtag-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
  # onnxruntime ships every platform's libraries: keep this one's, without CUDA
  - "!node_modules/onnxruntime-node/bin/**"
  - node_modules/onnxruntime-node/bin/napi-v6/${platform}/${arch}/**
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_cuda.so"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_tensorrt.so"
# CLIP's vocabulary, for SAM 3's and YOLO-World's word prompts
extraResources:
  - from: resources/clip
    to: clip
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
# sharp and onnxruntime come prebuilt for Node-API: nothing to compile
npmRebuild: false
extraMetadata:
  main: out/main/index.js
fileAssociations: []
# Icons from docs/mark/icons.cjs: each carries the small mark at the sizes where detail would turn to noise
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Seamtag
mac:
  icon: resources/icon.icns
  category: public.app-category.graphics-design
  target:
    - target: dmg
  # Ad-hoc signed, so it runs on Apple silicon; not notarised (see the README)
  identity: "-"
  hardenedRuntime: false
linux:
  icon: resources/icons
  category: Graphics
  synopsis: Image labelling in LabelMe, Pascal VOC, YOLO or CreateML format
  description: Label images with polygons, boxes, brush and eraser, AI segmentation and review of model proposals. Saves LabelMe JSON, Pascal VOC, YOLO and CreateML files.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Jakhongir Nodirov <jakhon37@gmail.com>
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
